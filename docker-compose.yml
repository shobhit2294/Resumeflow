services:
  # ─── Nginx Load Balancer ──────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: resumeflow_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - client_dist:/usr/share/nginx/html:ro
    depends_on:
      server:
        condition: service_started
      client_builder:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - resumeflow_net

  # ─── React Client Builder ─────────────────────────────────────
  client_builder:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: resumeflow_client_build
    restart: "no"
    volumes:
      - client_dist:/app/dist_out
    environment:
      - VITE_API_URL=/api
      - VITE_SOCKET_URL=http://localhost
    networks:
      - resumeflow_net

  # ─── Node.js API Server (3 instances for load balancing) ──────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/resumeflow}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - resumeflow_net

  # ─── MongoDB (Reliable local database for Docker) ─────────────
  mongo:
    image: mongo:7.0
    container_name: resumeflow_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - resumeflow_net

  # ─── Redis (OTP store + Socket.io pub/sub) ────────────────────
  redis:
    image: redis:7-alpine
    container_name: resumeflow_redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - resumeflow_net
    volumes:
      - redis_data:/data

networks:
  resumeflow_net:
    driver: bridge

volumes:
  client_dist:
  redis_data:
  mongo_data:
