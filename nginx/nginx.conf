worker_processes auto;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_types         text/plain text/css application/json application/javascript
                       text/xml application/xml image/svg+xml;

    # ── Rate limiting ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Upstream: 3 Node.js instances (round-robin) ───────────────
    upstream resumeflow_api {
        least_conn;                         # route to least busy instance
        server server:5000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Upstream for Socket.io (sticky by session) ────────────────
    upstream resumeflow_socket {
        ip_hash;                            # sticky sessions for WebSocket
        server server:5000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 15M;

        # ── Serve React SPA ──────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — all non-API routes serve index.html
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Static assets — long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2|woff)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── API Proxy → Node.js (load balanced) ──────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://resumeflow_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Auth routes — stricter rate limit ─────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass         http://resumeflow_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Socket.io — sticky session upstream ───────────────────
        location /socket.io/ {
            proxy_pass         http://resumeflow_socket;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "Upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── Health check ──────────────────────────────────────────
        location /health {
            proxy_pass http://resumeflow_api/api/health;
        }
    }
}

